services:
  - type: web
    name: cipher-messaging-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data.db
